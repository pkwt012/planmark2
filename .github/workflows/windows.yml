name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt "pyinstaller>=6.11,<7"

      - name: Check imports
        run: python -c "import tkinter, pymupdf; from elecplan.server import App; from elecplan.library import project_root; assert (project_root() / 'symbols').is_dir()"

      - name: Build
        run: python -m PyInstaller packaging/planmarks.spec

      - name: Add the Windows readme
        run: copy packaging\WINDOWS.txt dist\PlanMarks\ReadMe.txt

      - name: Confirm the program
        shell: pwsh
        run: |
          $exe = Get-Item dist\PlanMarks\PlanMarks.exe
          if ($exe.Length -lt 1MB) { throw "PlanMarks.exe is unexpectedly small" }
          if (!(Test-Path dist\PlanMarks\_internal\symbols\catalog.json)) { throw "symbols were not packaged" }
          if (!(Test-Path dist\PlanMarks\_internal\elecplan\static\index.html)) { throw "the page was not packaged" }
          if (!(Test-Path dist\PlanMarks\_internal\elecplan\static\core.js)) { throw "page scripts were not packaged" }
          $dll = Get-ChildItem -Recurse dist\PlanMarks\_internal -Filter mupdfcpp64.dll
          if (-not $dll) { throw "MuPDF library was not packaged" }

      - name: Self-check the program
        timeout-minutes: 4
        shell: pwsh
        run: |
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo.FileName = (Resolve-Path "dist\PlanMarks\PlanMarks.exe").Path
          $p.StartInfo.Arguments = "--self-check"
          $p.StartInfo.UseShellExecute = $false
          if (-not $p.Start()) { throw "could not start PlanMarks.exe" }
          if (-not $p.WaitForExit(150000)) {
            try { $p.Kill() } catch {}
            throw "self-check timed out"
          }
          if ($p.ExitCode -ne 0) { throw "self-check exited $($p.ExitCode)" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\PlanMarks -DestinationPath PlanMarks-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PlanMarks-Windows
          path: PlanMarks-Windows.zip

      - name: Publish the download
        if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Release Plan Marks 2.8')) }}"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8
          name: Plan Marks 2.8
          make_latest: "true"
          files: PlanMarks-Windows.zip
          body: |
            Plan Marks 2.8. Unzip the folder, then double-click PlanMarks.exe.
            Leave the small Plan Marks window open while you work. Close it to quit.
            Keep PlanMarks.exe and the _internal folder together.
            Your PDFs stay on this computer.
            If Windows says it protected your PC, choose More info, then Run anyway.

            Commands sit on a ribbon: Home, Sheets, Layers, View, and Export.
            Every symbol can take a height. A plain number is inches, so 48 becomes 48". It prints beside the symbol. A new mark starts blank.
            A countertop receptacle, a television, or an appliance can take an ampacity. A plain number is amps, so 30 becomes 30A. Type the whole rating when it is more than a number, such as 40A 240V. It prints beside the symbol. A new mark starts blank.
            Letters on a switch, a detector, or equipment stay right-side up.
            Most used, at the top of the list, shows the six symbols placed most often on the plan. List, next to the filter, shows one symbol per row.
            Snap pulls a light onto a plan line. An outlet or a switch sits on the open side of the wall. Outlet lines run out from the wall. A switch turns to follow the wall. A switch group follows the first switch, including at a corner.
            A dashed line continues from click to click. Enter, Esc, or a double-click finishes the chain.
            The symbol list adds a wall oven, cooktop, dishwasher, microwave, refrigerator, washer, dryer, television, heat detector, disconnect, and a smoke/CO detector, plus step, art, shop, vanity, and chandelier lights, 4 in and 6 in cans, sensor and fan controls, 20A and half-hot outlets, generator inlets, and equipment such as pumps, a hardwired EV charger, transfer switches, a subpanel, a junction box, and a gate.
            Drop legend places a key in an open area. This sheet only is the usual choice. Refresh sheets rebuilds a legend, counts, or schedule. Delete sheet removes an added sheet.
            A note uses the layer selected when you place it. Smoke detectors and smoke/CO detectors go on Lighting.
            A hidden layer stays off the legend.
            Sheets you add are kept, and opening the original PDF asks whether to bring them back.
            Export final erases the text and scanned image under a white box. Export all layers paints that box in its layer, so turning the layer off shows the plan again.
            Recovery files that sit unused for 90 days are removed when the program starts.
            Marks are saved in this browser and, about every 75 seconds, in a planmarks-recovery folder next to PlanMarks.exe.
